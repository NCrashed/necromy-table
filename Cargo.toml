[package]
name = "necromy-table"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["crates/rules", "crates/dice", "crates/oracle", "crates/host", "crates/net", "crates/server"]
exclude = ["patches/bevy_audio"]

[dependencies]
necromy-rules = { path = "crates/rules" }
necromy-dice = { path = "crates/dice" }
necromy-oracle = { path = "crates/oracle" }
necromy-host = { path = "crates/host" }
necromy-net = { path = "crates/net" }
bevy = "0.19"
bevy_sprite3d = "9"
bevy_spritesheet_animation = "7"
hexx = "0.25"
# Only to give the window its icon (src/icon.rs); the same winit as Bevy's.
winit = { version = "0.30", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }

[features]
# Fast incremental builds during development: `cargo run --features dev`
dev = ["bevy/dynamic_linking"]

# Keep our code quick to compile, but optimize dependencies (Bevy is slow in debug).
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[build-dependencies]
# The exe's icon on Windows (build.rs), compiled with llvm-rc.
embed-resource = "3.0.11"

# Bevy's audio with its output reopened when the device changes or fails
# (headphones plugged in mid-game): patches/bevy_audio/src/audio_output.rs,
# `reconnect_audio_output`. Drop the patch once Bevy does this itself.
[patch.crates-io]
bevy_audio = { path = "patches/bevy_audio" }
