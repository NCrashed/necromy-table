[package]
name = "necromy-table"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["crates/rules", "crates/dice", "crates/oracle", "crates/host"]

[dependencies]
necromy-rules = { path = "crates/rules" }
necromy-dice = { path = "crates/dice" }
necromy-oracle = { path = "crates/oracle" }
necromy-host = { path = "crates/host" }
bevy = "0.19"
bevy_sprite3d = "9"
bevy_spritesheet_animation = "7"
hexx = "0.25"

[features]
# Fast incremental builds during development: `cargo run --features dev`
dev = ["bevy/dynamic_linking"]

# Keep our code quick to compile, but optimize dependencies (Bevy is slow in debug).
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
